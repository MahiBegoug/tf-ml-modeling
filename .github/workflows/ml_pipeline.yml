name: ML Pipeline S3 & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install boto3 pytest
        pip install -e .
        # Install test dependencies if any specific ones exist, otherwise the above covers it

    - name: Run S3 Integration Test
      run: |
        python -m unittest ml/tests/test_s3_workflow.py

    - name: Run All Tests
      run: |
        python -m unittest discover ml/tests

    - name: Build Docker Image
      run: |
        docker build -t tf-ml-modeling .

    - name: Verify Docker Mock S3 Download
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        S3_BUCKET: ${{ secrets.S3_BUCKET }}
        S3_MODEL_PREFIX: ${{ secrets.S3_MODEL_PREFIX }}
      run: |
        # If secrets are not set, these will be empty. 
        # We can default to dummy values for the smoke test if needed, or echo a warning.
        if [ -z "$AWS_ACCESS_KEY_ID" ]; then
          echo "WARNING: AWS Secrets not set. Using dummy values for smoke test."
          export AWS_ACCESS_KEY_ID="testing"
          export AWS_SECRET_ACCESS_KEY="testing"
          export AWS_REGION="us-east-1"
          export S3_BUCKET="test-bucket"
          export S3_MODEL_PREFIX="models/"
        fi
        
        # We run the container and override the command to just check the download script's help
        docker run --rm --entrypoint python \
          -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID \
          -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY \
          -e AWS_REGION=$AWS_REGION \
          -e S3_BUCKET=$S3_BUCKET \
          -e S3_MODEL_PREFIX=${S3_MODEL_PREFIX:-models/} \
          tf-ml-modeling download_models.py --help
