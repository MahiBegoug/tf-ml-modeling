name: User Prediction Demo

on:
  repository_dispatch:
    types: [trigger-prediction]
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Model Name (in S3)'
        required: true
        default: 'randomforest_model'
      threshold:
        description: 'Prediction Threshold (0.0 - 1.0)'
        required: false
        default: '0.5'
      s3_bucket_override:
        description: 'S3 Bucket (Optional Override)'
        required: false
      s3_prefix_override:
        description: 'S3 Model Prefix (Optional Override)'
        required: false
        default: 'pre_trained_defect_models/'
      run_aggregation:
        description: 'Run History Aggregation?'
        required: false
        type: boolean
        default: true

jobs:
  predict-test:
    runs-on: ubuntu-latest
    permissions:
      packages: read  # Allow pulling image

    steps:

      - name: Checkout Code (To use latest scripts)
        uses: actions/checkout@v3

      - name: Prepare Lowercase Image Name
        run: |
          echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Download Real Input Data (from S3)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ inputs.s3_bucket_override || secrets.S3_BUCKET }}
        run: |
          echo "🚀 Downloading metrics_current.csv from s3://$S3_BUCKET/metrics/..."
          
          # Using AWS CLI (pre-installed on GitHub Runners)
          aws s3 cp s3://$S3_BUCKET/metrics/metrics_current.csv input.csv
          
          # Verify download
          ls -l input.csv

      - name: Run Prediction (Using Docker Image)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          # Use Override if provided, else Use Secret
          # Use Override if provided, else Use Secret
          S3_BUCKET: ${{ (github.event.inputs.s3_bucket_override || github.event.client_payload.s3_bucket_override) || secrets.S3_BUCKET }}
          S3_MODEL_PREFIX: ${{ (github.event.inputs.s3_prefix_override || github.event.client_payload.s3_prefix_override) || secrets.S3_MODEL_PREFIX }}
          # Handle Model Name from Input OR Payload
          MODEL_NAME: ${{ github.event.inputs.model_name || github.event.client_payload.model_name || 'randomforest_model' }}
        run: |
          echo "🚀 Pulling image: ghcr.io/${{ env.IMAGE_NAME }}:latest"
          echo "ℹ️ Using Model: $MODEL_NAME"
          
          # Run the container
          # -v $(pwd):/app/data  -> Mount current dir to /app/data so we can read input.csv and write output
          
          docker run --rm \
            -v $(pwd):/app/data \
            -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY \
            -e AWS_REGION=$AWS_REGION \
            -e S3_BUCKET=$S3_BUCKET \
            -e S3_MODEL_PREFIX=${S3_MODEL_PREFIX} \
            -e GITHUB_SHA=${{ github.sha }} \
            ghcr.io/${{ env.IMAGE_NAME }}:latest \
            predict \
              --csv /app/data/input.csv \
              --model ${{ env.MODEL_NAME }} \
              --output /app/data/predictions.csv \
              --threshold ${{ inputs.threshold || 0.5 }}


      - name: Show Results
        run: |
          ls -l predictions.csv
          cat predictions.csv

      - name: Aggregate History (Using Mounted Code)
        if: success() && inputs.run_aggregation == true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ inputs.s3_bucket_override || secrets.S3_BUCKET }}
        run: |
          echo "🚀 Running History Aggregation..."
          
          # Mount local code to override container code
          docker run --rm \
            -v $(pwd):/app/data \
            -v $(pwd)/ml:/app/ml \
            -v $(pwd)/run_ml.py:/app/run_ml.py \
            -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY \
            -e AWS_REGION=$AWS_REGION \
            -e S3_BUCKET=$S3_BUCKET \
            ghcr.io/${{ env.IMAGE_NAME }}:latest \
            aggregate
